name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: '1'
      NEXT_PUBLIC_GITHUB_PAGES: '1'
      NEXT_PUBLIC_GITHUB_USERNAME: tatheer583
      NEXT_PUBLIC_SITE_URL: https://tatheer583.github.io/portfolio
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Move server routes out of static build
        shell: bash
        run: |
          set -euo pipefail
          hold_dir='.pages-server-routes'
          mkdir -p "$hold_dir"
          mv app/api "$hold_dir/api"
          mv app/resume "$hold_dir/resume"

      - name: Build static portfolio
        run: npm run build

      - name: Prepare Pages assets
        run: |
          node scripts/prepare-github-pages.cjs out
          touch out/.nojekyll

      - name: Restore server routes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d '.pages-server-routes/api' ]; then mv .pages-server-routes/api app/api; fi
          if [ -d '.pages-server-routes/resume' ]; then mv .pages-server-routes/resume app/resume; fi
          rmdir .pages-server-routes 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
